spring.application.name=lecture-3-uppgifter

# Write log to file
logging.file.name=logs/app.log

# Rotate logs, save logs (optional, CASE SENSITIVE)
logging.logback.rollingpolicy.max-history=1
logging.logback.rollingpolicy.max-file-size=8KB
logging.level.root=WARN

spring.datasource.url=jdbc:postgresql://localhost:5432/myTest
spring.datasource.username=postgres
spring.datasource.password=anna12345
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation = true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
